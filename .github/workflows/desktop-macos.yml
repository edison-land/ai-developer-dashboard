name: Desktop macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned macOS desktop artifacts
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build unsigned macOS packages
        run: pnpm desktop:package:mac:unsigned

      - name: Upload unsigned macOS packages
        uses: actions/upload-artifact@v4
        with:
          # Pull-request artifacts are for smoke testing only. Public release
          # packages must use `desktop:package:mac` with Developer ID signing
          # and notarization credentials configured.
          name: ai-developer-dashboard-macos-unsigned-ci
          path: |
            dist/**/*.dmg
            dist/**/*.zip
          if-no-files-found: error
          retention-days: 14
